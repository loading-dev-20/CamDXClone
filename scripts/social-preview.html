<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CamDX Hackathon 2026 — social preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #06112a;
      --text: #eaf2ff;
      --muted: #a3b6d9;
      --cyan: #2ed8f0;
      --magenta: #f0388f;
      --amber: #f7a531;
      --teal: #3cc6a4;
      --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      --body: "Noto Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }

    body {
      background-color: var(--ink);
      background-image:
        radial-gradient(760px 520px at 86% 18%, #123578 0%, transparent 62%),
        radial-gradient(520px 420px at 8% 110%, rgba(240, 56, 143, 0.16) 0%, transparent 65%),
        linear-gradient(160deg, #071530 0%, #06112a 55%, #040c1e 100%);
      color: var(--text);
      font-family: var(--body);
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(120, 180, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120, 180, 255, 0.06) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(700px 500px at 78% 42%, #000 20%, transparent 75%);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 54px 64px 62px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--amber);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--magenta), var(--amber));
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 108px;
      font-style: italic;
      font-weight: 800;
      line-height: 0.82;
      letter-spacing: 0.5px;
      text-shadow:
        4px 4px 0 rgba(240, 56, 143, 0.55),
        -4px -3px 0 rgba(46, 216, 240, 0.4);
    }

    h1 span { display: block; }

    .tagline {
      margin: 24px 0 8px;
      color: var(--teal);
      font-size: 29px;
      font-weight: 600;
      line-height: 1.3;
    }

    .lead {
      max-width: 540px;
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.55;
    }

    .meta {
      position: absolute;
      left: 64px;
      bottom: 38px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 15px;
    }

    .meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .meta .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      opacity: 0.7;
    }

    .art {
      position: relative;
      width: 470px;
      height: 470px;
      justify-self: center;
    }

    .art svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .art .halo {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 216, 240, 0.16), transparent 68%);
      filter: blur(10px);
    }

    .corner {
      position: absolute;
      top: 26px;
      right: 28px;
      padding: 7px 13px;
      border: 1px solid rgba(120, 180, 255, 0.28);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .corner b { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <span class="corner"><b>camdx</b> hackathon</span>

  <main class="frame">
    <div class="copy">
      <p class="eyebrow">12–13 DECEMBER 2026 · PHNOM PENH</p>
      <h1><span>CamDX</span><span>Hackathon</span><span>2026</span></h1>
      <p class="tagline">Exchange data for the public good</p>
      <p class="lead">Build digital solution prototypes that improve public service delivery.</p>
    </div>

    <div class="art" aria-hidden="true">
      <div class="halo"></div>
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <radialGradient id="hubFill" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#173b7f"/>
            <stop offset="100%" stop-color="#091a3d"/>
          </radialGradient>
        </defs>

        <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(120,180,255,.14)" stroke-dasharray="3 10"/>
        <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(120,180,255,.1)"/>

        <g stroke="rgba(120,180,255,.32)" stroke-width="1.5">
          <path d="M200 200 200 38"/>
          <path d="M200 200 340 108"/>
          <path d="M200 200 340 292"/>
          <path d="M200 200 200 362"/>
          <path d="M200 200 60 292"/>
          <path d="M200 200 60 108"/>
          <path d="M200 200 254 41"/>
        </g>

        <g fill="#2ED8F0" opacity=".75">
          <circle cx="228" cy="138" r="4"/>
          <circle cx="264" cy="164" r="3"/>
        </g>
        <g fill="#F0388F">
          <circle cx="264" cy="240" r="4"/>
          <circle cx="146" cy="240" r="3"/>
        </g>
        <g fill="#F7A531">
          <circle cx="172" cy="272" r="3.5"/>
          <circle cx="142" cy="168" r="3"/>
        </g>

        <g filter="url(#glow)">
          <circle cx="200" cy="38" r="10" fill="#F0388F"/>
          <circle cx="340" cy="108" r="9" fill="#2ED8F0"/>
          <circle cx="340" cy="292" r="9" fill="#F7A531"/>
          <circle cx="200" cy="362" r="10" fill="#3CC6A4"/>
          <circle cx="60" cy="292" r="9" fill="#F0388F"/>
          <circle cx="60" cy="108" r="9" fill="#2ED8F0"/>
          <circle cx="254" cy="41" r="7" fill="#F7A531"/>
        </g>

        <circle cx="200" cy="200" r="66" fill="url(#hubFill)" stroke="#2ED8F0" stroke-width="2.5"/>
        <circle cx="200" cy="200" r="82" fill="none" stroke="rgba(46,216,240,.28)" stroke-width="1.5"/>

        <text x="200" y="208" text-anchor="middle" fill="#EAF2FF"
              font-family="Barlow Condensed, Arial Narrow, sans-serif"
              font-style="italic" font-weight="800" font-size="36" letter-spacing=".5">CamDX</text>
        <text x="200" y="230" text-anchor="middle" fill="#8FA9D6"
              font-family="Noto Sans, sans-serif" font-weight="600" font-size="9"
              letter-spacing="3">DATA EXCHANGE</text>
      </svg>
    </div>
  </main>

  <div class="meta">
    <span><strong>CamDX Hackathon 2026</strong></span>
    <span class="dot"></span>
    <span>Unofficial prototype</span>
    <span class="dot"></span>
    <span>hackathon.camdx.gov.kh</span>
  </div>
</body>
</html>
